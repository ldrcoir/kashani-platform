[package]
name = "kashani-volunteer"
version = "0.1.0"
edition = "2021"
authors = ["Persian Math Platform <ehsanmorad@factordb.com>"]
description = "Volunteer computing client for Persian Math Platform"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
gmp-mp-fr = { version = "2024", optional = true }
rug = { version = "1", optional = true }
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
dirs = "5"

[features]
default = ["gmp"]
gmp = ["dep:gmp-mp-fr"]
fast = ["dep:rug"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
